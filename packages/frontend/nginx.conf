server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API, health, and metrics to the backend sidecar container.
    # Both containers share the same network namespace inside the ECS task,
    # so localhost:4000 reaches the backend without any cross-service routing.
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://localhost:4000/health;
    }

    location /metrics {
        proxy_pass http://localhost:4000/metrics;
    }

    # SPA routing — return index.html for any route the frontend owns
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (create-react-app hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
