name: "Step PE-4 # Detect PR Opened — Open Review"

on:
  # pull_request:
  #   types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Todo Service CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get response templates
        uses: actions/checkout@v5
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Update comment - checking work
        run: |
          gh issue comment "$ISSUE_URL" \
            --body-file exercise-toolkit/markdown-templates/step-feedback/checking-work.md \
            --edit-last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # START: Check practical exercise

      - name: Check build-and-push job completed successfully
        id: check-ci-run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the workflow run ID — direct from event or by looking up the PR's head SHA
          RUN_ID="${{ github.event.workflow_run.id }}"

          if [ -z "$RUN_ID" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            if [ -z "$PR_NUMBER" ]; then
              echo "No PR number available (workflow_dispatch) — skipping run check."
              exit 0
            fi
            HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
            echo "PR head SHA: $HEAD_SHA"
            RUN_ID=$(gh run list \
              --workflow "todo-service-ci.yml" \
              --commit "$HEAD_SHA" \
              --json databaseId \
              --jq '.[0].databaseId' 2>/dev/null || echo "")
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find a Todo Service CI run for this PR."
            exit 1
          fi

          echo "Checking jobs for run ID: $RUN_ID"
          BUILD_PUSH_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name | test("build-and-push"; "i"))] | .[0].conclusion' 2>/dev/null || echo "")

          if [ "$BUILD_PUSH_CONCLUSION" = "success" ]; then
            echo "build-and-push job completed successfully."
            exit 0
          fi

          echo "::error::The build-and-push job has not completed successfully (conclusion: '${BUILD_PUSH_CONCLUSION:-not found}'). Wait for the full pipeline including build-and-push to go green, then re-trigger this check."
          exit 1

      - name: Comment on PR with review checklist
        if: (github.event_name == 'pull_request' || github.event_name == 'workflow_run') && steps.check-ci-run.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request?.number
              || context.payload.workflow_run?.pull_requests?.[0]?.number;
            if (!prNumber) { core.warning('No PR number found — skipping comment'); return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### Golden Path PR Detected 🎉\n\nYour PR has been detected as the final golden path deliverable.\n\n**Before merging, verify:**\n- [ ] PR description has "what changed / why" narrative\n- [ ] Evidence section is filled (terraform plan, checkov, CI, dashboard)\n- [ ] "How to Adopt" quickstart is clear for a new team\n- [ ] \`terraform-apply\` job is wired with OIDC in \`golden-path-ci.yml\``
            });

      - name: Fail job if Todo Service CI did not pass
        if: steps.check-ci-run.outcome != 'success'
        run: exit 1

      # END: Check practical exercise

      - name: Build message - step finished
        id: build-message-step-finish
        uses: skills/action-text-variables@v4
        with:
          template-file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          template-vars: |
            next_step_number: PE-x

      - name: Update comment - step finished
        run: |
          gh issue comment "$ISSUE_URL" \
            --body "$ISSUE_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ steps.build-message-step-finish.outputs.updated-text }}

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get response templates
        uses: actions/checkout@v5
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - add step content
        run: |
          gh issue comment "$ISSUE_URL" \
            --body-file ".github/steps/pe-x-review.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable current workflow
        run: |
          gh workflow disable "4-pe-open-pr.yml"
          gh workflow enable "pe-terraform-destroy.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
